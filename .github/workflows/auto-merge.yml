name: Auto PR and CI Gate

on:
  push:
    branches-ignore:
      - 'integration/master' # Prevents the workflow from triggering when a merge happens here

jobs:
  auto-pr-ci-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write

    steps:
      # Updated execution environment automatically resolves Node 24 warnings
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch integration branch reference
        run: git fetch origin integration/master:refs/remotes/origin/integration/master

      # Create the PR and wait for CI; merging remains a deliberate human action.
      - name: Create Pull Request and Wait for CI
        run: |
          # 1. Reuse an existing PR when present, otherwise create a new one.
          PR_URL=$(gh pr list \
            -B integration/master \
            -H "${{ github.ref_name }}" \
            --json url \
            --jq '.[0].url')

          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              -B integration/master \
              -H "${{ github.ref_name }}" \
              --title "Auto PR: Merge ${{ github.ref_name }} into integration/master" \
              --body "Pull Request automatically generated by GitHub Actions.")
          fi

          echo "Using pull request: $PR_URL"

          # 2. Wait for the Backend CI workflow on this branch.
          RUN_ID=""
          for i in {1..30}; do
            RUN_ID=$(gh run list \
              --workflow "Backend CI" \
              --branch "${{ github.ref_name }}" \
              --json databaseId \
              --jq '.[0].databaseId')

            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Backend CI run was not found for branch ${{ github.ref_name }}"
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status

          echo "Backend CI passed. Manual review and merge are required for $PR_URL."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
