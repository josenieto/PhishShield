name: Backend CI

on:
  push:
  pull_request:
    branches:
      - integration/master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend with test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run test suite
        run: python -m pytest

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t phishshield-backend:ci .

      - name: Run backend container
        run: docker run -d --rm --name phishshield-backend-ci -p 8000:8000 phishshield-backend:ci

      - name: Wait for health endpoint
        run: |
          for i in {1..20}; do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs phishshield-backend-ci
          exit 1

      - name: Stop backend container
        if: always()
        run: docker stop phishshield-backend-ci || true
