name: Backend CI

on:
  push:
  pull_request:
    branches:
      - integration/master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend with test and ML dependencies
        run: python -m pip install -e ".[test,ml]"

      - name: Run test suite
        run: python -m pytest

      - name: Smoke test deterministic CLI JSON output
        run: |
          python -m infrastructure.entrypoints.cli analyze tests/fixtures/emails/benign_account_summary.eml --format json > cli-result.json
          python -c "import json; data=json.load(open('cli-result.json', encoding='utf-8')); assert data['risk_score']['risk_level'] == 'LOW'"

      - name: Smoke test deterministic CLI threshold exit code
        run: |
          set +e
          python -m infrastructure.entrypoints.cli analyze tests/fixtures/emails/suspicious_html_notice.eml --fail-on high
          status=$?
          set -e
          test "$status" -eq 1

  guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run hygiene and architecture guardrails
        run: |
          python -m pre_commit run trailing-whitespace --all-files
          python -m pre_commit run end-of-file-fixer --all-files
          python -m pre_commit run check-yaml --all-files
          python -m pre_commit run check-toml --all-files
          python -m pre_commit run check-added-large-files --all-files
          python -m pre_commit run detect-private-key --all-files
          python -m pre_commit run architecture-boundaries --all-files

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend-test
      - guardrails

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t phishshield-backend:ci .

      - name: Run backend container
        run: docker run -d --rm --name phishshield-backend-ci -p 8000:8000 phishshield-backend:ci

      - name: Wait for health endpoint
        run: |
          for i in {1..20}; do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs phishshield-backend-ci
          exit 1

      - name: Stop backend container
        if: always()
        run: docker stop phishshield-backend-ci || true

  compose-smoke:
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend-test
      - guardrails

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start complete Compose stack
        run: docker compose up --build -d

      - name: Wait for frontend and backend proxy
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Validate frontend response
        run: curl --fail --silent http://127.0.0.1:8080 | grep -q '<div id="root">'

      - name: Analyze benign fixture through Compose proxy
        run: |
          curl --fail --silent \
            -F 'file=@tests/fixtures/emails/benign_account_summary.eml;type=message/rfc822' \
            http://127.0.0.1:8080/api/analyze-email > benign-analysis.json
          python -c "import json; data=json.load(open('benign-analysis.json', encoding='utf-8')); assert data['risk_score']['risk_level'] == 'LOW'"

      - name: Analyze suspicious fixture through Compose proxy
        run: |
          curl --fail --silent \
            -F 'file=@tests/fixtures/emails/suspicious_html_notice.eml;type=message/rfc822' \
            http://127.0.0.1:8080/api/analyze-email > suspicious-analysis.json
          python -c "import json; data=json.load(open('suspicious-analysis.json', encoding='utf-8')); assert data['risk_score']['risk_level'] == 'CRITICAL'"

      - name: Stop complete Compose stack
        if: always()
        run: docker compose down --volumes
