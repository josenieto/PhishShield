name: Publish GHCR Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, for example v0.1.0-rc.2.
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}

    steps:
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid image tag: $tag. Expected a version beginning with v." >&2
            exit 2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/phishshield-backend
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/phishshield-frontend
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.title=PhishShield
            org.opencontainers.image.description=Local, explainable phishing-email triage for .eml files.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/phishshield-backend:${{ steps.version.outputs.tag }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=phishshield-backend
          cache-to: type=gha,mode=max,scope=phishshield-backend

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/phishshield-frontend:${{ steps.version.outputs.tag }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=phishshield-frontend
          cache-to: type=gha,mode=max,scope=phishshield-frontend
