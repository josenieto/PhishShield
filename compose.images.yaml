services:
  backend:
    image: ghcr.io/${PHISHSHIELD_IMAGE_NAMESPACE:-josenieto}/phishshield-backend:${PHISHSHIELD_IMAGE_TAG:-v0.1.0-rc.2}
    environment:
      PHISHSHIELD_MAX_UPLOAD_BYTES: ${PHISHSHIELD_MAX_UPLOAD_BYTES:-1000000}
      PHISHSHIELD_MODEL_ASSESSMENT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    image: ghcr.io/${PHISHSHIELD_IMAGE_NAMESPACE:-josenieto}/phishshield-frontend:${PHISHSHIELD_IMAGE_TAG:-v0.1.0-rc.2}
    ports:
      - "${PHISHSHIELD_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
